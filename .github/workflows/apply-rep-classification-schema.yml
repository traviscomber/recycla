name: Apply REP Classification Schema

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-rep-classification-schema.yml"

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply and verify REP classification schema
        shell: bash
        run: |
          set -euo pipefail
          response=""
          for attempt in $(seq 1 36); do
            if response="$(curl --fail --silent --show-error \
              -X POST \
              -H 'x-migration-confirm: rep-classification-20260925' \
              'https://recyclachile.vercel.app/api/admin/rep-classification-schema')"; then
              if node -e 'const r=JSON.parse(process.argv[1]); if (!r.ok || r.marketColumns !== 5 || r.wasteColumns !== 5 || r.collectionColumns !== 4 || !r.eventsTable) process.exit(1)' "$response"; then
                echo "$response"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "$response"
          exit 1
